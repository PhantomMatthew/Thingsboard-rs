syntax = "proto3";

package tb.edqs;

import "common.proto";

// EDQS 读模型同步事件：实体/属性/latest 遥测变更，经 Kafka topic tb_edqs.events 投递，
// message key = tenant_id（按租户分区保序）。
message EdqsEventMsg {
  string tenant_id = 1;
  oneof event {
    EntityUpsertMsg entity_upsert = 2;
    EntityDeleteMsg entity_delete = 3;
    AttributeUpdateMsg attribute_update = 4;
    LatestTelemetryMsg latest_telemetry = 5;
    TenantDeleteMsg tenant_delete = 6;
    LatestDeleteMsg latest_delete = 7;
    TenantResyncMsg tenant_resync = 8;
  }
}

// 增量可能已丢失（发送失败/队列满）：EDQS 从 PostgreSQL 重载该租户。
message TenantResyncMsg {
  string tenant_id = 1;
}

message TenantDeleteMsg {
  string tenant_id = 1;
}

// 实体创建/更新（本期支持 device/asset）。type_or_profile：device.type，asset 暂为空串。
message EntityUpsertMsg {
  string entity_id = 1;
  tb.common.EntityType entity_type = 2;
  string customer_id = 3; // 空串 = 无客户
  string name = 4;
  string type_or_profile = 5;
  string label = 6;
  int64 created_time = 7;
}

message EntityDeleteMsg {
  string entity_id = 1;
  tb.common.EntityType entity_type = 2;
}

// 属性保存或删除：deleted_keys 非空表示删除。
message AttributeUpdateMsg {
  string entity_id = 1;
  tb.common.AttributeScope scope = 2;
  repeated tb.common.KeyValueProto updated = 3;
  repeated string deleted_keys = 4;
  int64 update_ts = 5;
}

// latest 遥测更新：ts 与 values 下标对齐。
message LatestTelemetryMsg {
  string entity_id = 1;
  repeated tb.common.KeyValueProto values = 2;
  repeated int64 ts = 3;
}

// latest 删除：keys 中 ts 落在 [start_ts, end_ts] 的 latest 先移除，
// 再按 ts 规则应用 replacements（范围删除后重算出的值，与 replacement_ts 下标对齐）。
message LatestDeleteMsg {
  string entity_id = 1;
  repeated string keys = 2;
  int64 start_ts = 3;
  int64 end_ts = 4;
  repeated tb.common.KeyValueProto replacements = 5;
  repeated int64 replacement_ts = 6;
}
