# Thingsboard-rs 生产部署模板。
# 用法：cp .env.prod.example .env.prod 并填入真实值，然后
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 应用镜像：docker build -f docker/Dockerfile -t thingsboard-rs:latest .

name: thingsboard-rs-prod

# Kafka 客户端：SASL/PLAIN 认证（KAFKA_PASSWORD 仅用 URL/JAAS 安全字符，如 openssl rand -hex 32）。
x-kafka-client: &kafka-client
  TB_KAFKA_BROKERS: kafka:9092
  TB_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  TB_KAFKA_SASL_MECHANISM: PLAIN
  TB_KAFKA_SASL_USERNAME: ${KAFKA_USERNAME:-thingsboard}
  TB_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD:?KAFKA_PASSWORD required}

# 传输层租户限流（msg/s，0=不限）：共享桶经 Redis 跨全部传输实例合计，
# 每实例桶为补充上限（Redis 不可用时仍生效）。
x-transport-rate-limit: &transport-rate-limit
  TB_ENV: production
  TB_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
  TB_TRANSPORT_SHARED_RATE_LIMIT_PER_TENANT: ${TB_TRANSPORT_SHARED_RATE_LIMIT_PER_TENANT:-1000}
  TB_TRANSPORT_RATE_LIMIT_PER_TENANT: ${TB_TRANSPORT_RATE_LIMIT_PER_TENANT:-1000}

services:
  # ---------- 基础设施 ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thingsboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-thingsboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thingsboard}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # 不暴露端口：仅供容器网络内访问。

  # 客户端监听 SASL_PLAINTEXT（PLAIN 认证），关闭自动建 topic，由 kafka-init 受控创建。
  kafka:
    image: apache/kafka:3.9.0
    command:
      - /bin/bash
      - -c
      - |
        umask 077
        printf 'KafkaServer {\n  org.apache.kafka.common.security.plain.PlainLoginModule required\n  username="%s" password="%s"\n  user_%s="%s";\n};\n' \
          "$$TB_KAFKA_SASL_USERNAME" "$$TB_KAFKA_SASL_PASSWORD" "$$TB_KAFKA_SASL_USERNAME" "$$TB_KAFKA_SASL_PASSWORD" > /tmp/kafka_jaas.conf
        printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\n' \
          "$$TB_KAFKA_SASL_USERNAME" "$$TB_KAFKA_SASL_PASSWORD" > /tmp/client.properties
        exec /etc/kafka/docker/run
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/tmp/kafka_jaas.conf
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      TB_KAFKA_SASL_USERNAME: ${KAFKA_USERNAME:-thingsboard}
      TB_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD:?KAFKA_PASSWORD required}
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /tmp/client.properties --list"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # 一次性创建平台固定 topic（按节点的响应/通知 topic 由各服务启动时创建）。
  kafka-init:
    image: apache/kafka:3.9.0
    command:
      - /bin/bash
      - -c
      - |
        set -e
        umask 077
        printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\n' \
          "$$TB_KAFKA_SASL_USERNAME" "$$TB_KAFKA_SASL_PASSWORD" > /tmp/client.properties
        for spec in tb_transport.api.requests:10 tb_rule_engine.Main:10 tb_rule_engine.dlq:10 \
                    tb_core:10 tb_core.dlq:10 tb_usage_stats:10 tb_edqs.events:10; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/client.properties \
            --create --if-not-exists --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1
        done
    environment:
      TB_KAFKA_SASL_USERNAME: ${KAFKA_USERNAME:-thingsboard}
      TB_KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD:?KAFKA_PASSWORD required}
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- 应用服务（单一镜像，entrypoint 区分角色） ----------
  tb-core:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-core"]
    environment:
      TB_DATABASE_URL: postgres://${POSTGRES_USER:-thingsboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thingsboard}
      <<: *kafka-client
      TB_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TB_EDQS_URL: http://tb-edqs:8090
      TB_EDQS_API_KEY: ${TB_EDQS_API_KEY:?TB_EDQS_API_KEY required}
      TB_HTTP_PORT: 8080
      TB_ENV: production
      TB_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      TB_SYSADMIN_PASSWORD: ${TB_SYSADMIN_PASSWORD:?TB_SYSADMIN_PASSWORD required}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      tb-edqs: { condition: service_started }
    restart: unless-stopped

  tb-auth:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-auth"]
    environment:
      TB_DATABASE_URL: postgres://${POSTGRES_USER:-thingsboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thingsboard}
      TB_HTTP_PORT: 8081
      TB_ENV: production
      TB_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  tb-rule-engine:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-rule-engine"]
    environment:
      TB_DATABASE_URL: postgres://${POSTGRES_USER:-thingsboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thingsboard}
      <<: *kafka-client
      TB_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TB_RE_QUEUE: Main
      TB_RE_ALLOWED_HOSTS: ${TB_RE_ALLOWED_HOSTS:-}
      TB_RE_ALLOW_PRIVATE_NETWORK: ${TB_RE_ALLOW_PRIVATE_NETWORK:-false}
      TB_RE_KAFKA_ALLOWED_TOPIC_PREFIXES: ${TB_RE_KAFKA_ALLOWED_TOPIC_PREFIXES:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  tb-transport-mqtt:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-transport-mqtt"]
    environment:
      <<: [*kafka-client, *transport-rate-limit]
      TB_MQTT_BIND: 0.0.0.0:1883
      TB_NODE_ID: mqtt-1
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "1883:1883"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      tb-core: { condition: service_started }
    restart: unless-stopped

  tb-transport-http:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-transport-http"]
    environment:
      <<: [*kafka-client, *transport-rate-limit]
      TB_TRANSPORT_HTTP_PORT: 8088
      TB_NODE_ID: http-1
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8088:8088"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      tb-core: { condition: service_started }
    restart: unless-stopped

  tb-transport-coap:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-transport-coap"]
    environment:
      <<: [*kafka-client, *transport-rate-limit]
      TB_COAP_BIND: 0.0.0.0:5683
      TB_COAP_MAX_REQUESTS_PER_SEC: ${TB_COAP_MAX_REQUESTS_PER_SEC:-10000}
      TB_NODE_ID: coap-1
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "5683:5683/udp"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      tb-core: { condition: service_started }
    restart: unless-stopped

  tb-transport-snmp:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-transport-snmp"]
    environment:
      <<: [*kafka-client, *transport-rate-limit]
      TB_NODE_ID: snmp-1
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      tb-core: { condition: service_started }
    restart: unless-stopped

  tb-transport-lwm2m:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-transport-lwm2m"]
    environment:
      <<: [*kafka-client, *transport-rate-limit]
      TB_LWM2M_BIND: 0.0.0.0:5685
      TB_NODE_ID: lwm2m-1
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "5685:5685/udp"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      tb-core: { condition: service_started }
    restart: unless-stopped

  tb-edqs:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-edqs"]
    environment:
      TB_DATABASE_URL: postgres://${POSTGRES_USER:-thingsboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thingsboard}
      <<: *kafka-client
      TB_EDQS_PORT: 8090
      TB_EDQS_API_KEY: ${TB_EDQS_API_KEY:?TB_EDQS_API_KEY required}
      TB_EDQS_RECONCILE_INTERVAL_SECS: ${TB_EDQS_RECONCILE_INTERVAL_SECS:-600}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  tb-housekeeper:
    image: ${APP_IMAGE:-thingsboard-rs:latest}
    entrypoint: ["tb-housekeeper"]
    environment:
      TB_DATABASE_URL: postgres://${POSTGRES_USER:-thingsboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thingsboard}
      TB_HOUSEKEEPER_INTERVAL_SEC: ${HOUSEKEEPER_INTERVAL_SEC:-3600}
      TB_TS_TTL_DAYS: ${TS_TTL_DAYS:-0}
      TB_DEBUG_EVENT_TTL_DAYS: ${DEBUG_EVENT_TTL_DAYS:-7}
      TB_ALARM_TTL_DAYS: ${ALARM_TTL_DAYS:-0}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  redisdata:
